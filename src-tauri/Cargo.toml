[package]
name = "new-eden-atlas"
version = "1.0.1"
edition = "2021"
description = "Offline-first map and tactical analysis for New Eden"
authors = ["Shadowglyph"]
license = "MIT"
# The shell is the packaging of this repository, not a crate anyone depends on.
publish = false

[features]
# A release build is a windows-subsystem binary with nowhere to print, which
# makes --selftest useless on exactly the build most worth checking. This puts
# the console back without putting it back for everyone.
console = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
base64 = "0.23.1"
rand = "0.10.3"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
keyring = "4.2.0"

[profile.release]
# Measured in the spike: the whole application, archive included, installs
# smaller than an empty Electron shell. That result depends on these.
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# No `panic = "abort"`, deliberately. Every fallible step of sign-in runs on a
# blocking worker whose `.await` turns a failure into a sentence, and that arm is
# reached only when the worker unwinds. Under abort the process ends first and
# those messages are unreachable - which is how a panicking dependency became a
# window that vanishes. Cost measured: see the database entry for 2026-09-20.
# The selftest check "a panicking worker is reported rather than killing the
# application" fails by name if this is ever restored.
